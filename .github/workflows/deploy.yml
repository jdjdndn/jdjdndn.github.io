name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ===== 构建步骤（拆分便于定位失败点）=====
      - name: prebuild - 校验 wrangler 配置
        run: |
          echo "检查 wrangler.jsonc..."
          cat wrangler.jsonc
          grep -q '"404-page"' wrangler.jsonc && echo "✅ wrangler 已配 404-page" || { echo "❌ wrangler 缺少 404-page 配置"; exit 1; }

      - name: build - 同步友链
        run: node scripts/sync-friend-links.cjs

      - name: build - 生成 Vue 页面
        run: node scripts/gen-vue-pages.cjs

      - name: build - 生成副业指南
        run: node scripts/gen-fuye-guides.cjs

      - name: build - 生成 OG 图
        run: node scripts/gen-og-image.cjs

      - name: build - 生成图标
        run: node scripts/gen-icons.cjs

      - name: build - Vite 构建
        run: vite build

      - name: build - 复制共享资源
        run: node scripts/copy-shared.cjs

      - name: build - 压缩图片
        run: node scripts/compress-images.cjs

      - name: build - 生成着陆页
        run: node scripts/gen-landing-pages.cjs

      - name: build - 生成链接页数据
        run: node scripts/build-links-page.mjs json

      - name: build - SPA 预渲染
        run: node scripts/prerender-spa.cjs

      # ===== 质量门禁 =====

      # 质量门禁：SEO 审计 0 错误 0 警告（含 JSON-LD/llms 检查），失败则中止部署
      - name: SEO 审计门禁
        run: node scripts/seo-audit.cjs

      # 质量门禁：关键页面 Playwright 冒烟（无 JS 错误 / JSON-LD 可解析 / 关键元素存在）
      - name: Playwright 冒烟测试
        run: |
          npx playwright install --with-deps chromium
          node scripts/smoke-test.cjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
