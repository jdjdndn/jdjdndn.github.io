<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>优惠券管理</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      /* 管理页专属样式 */
      .page-nav {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .page-nav a {
        text-decoration: none;
        padding: 8px 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        transition: background 0.2s, color 0.2s;
      }
      .page-nav a:hover {
        background: var(--primary);
        color: #fff;
      }
      .page-nav a.active {
        background: var(--primary);
        color: #fff;
      }

      /* 搜索栏 */
      .search-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        align-items: center;
      }
      .search-bar input {
        flex: 1;
        margin-top: 0;
      }
      .search-bar .primary {
        white-space: nowrap;
      }

      /* 表格 */
      .table-wrap {
        overflow-x: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .data-table th,
      .data-table td {
        text-align: left;
        padding: 12px 14px;
        font-size: 14px;
        border-bottom: 1px solid var(--border);
      }
      .data-table th {
        background: #f1f5f9;
        font-weight: 700;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .data-table tr:last-child td {
        border-bottom: none;
      }
      .data-table tbody tr:hover {
        background: #f8fafc;
      }
      .data-table .code-cell {
        font-family: monospace;
        background: #eff6ff;
        color: #1d4ed8;
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: 700;
      }
      .data-table .link-cell {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .data-table .link-cell a {
        color: var(--primary);
        text-decoration: none;
      }
      .data-table .link-cell a:hover {
        text-decoration: underline;
      }
      .data-table .actions-cell {
        white-space: nowrap;
      }
      .data-table .actions-cell button {
        padding: 6px 12px;
        font-size: 13px;
        margin-right: 6px;
      }
      .data-table .actions-cell button:last-child {
        margin-right: 0;
      }

      .empty-msg {
        text-align: center;
        color: var(--muted);
        padding: 48px 16px;
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .count-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      /* 模态框 */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-overlay.hidden {
        display: none;
      }
      .modal {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        padding: 28px;
        width: 90%;
        max-width: 460px;
      }
      .modal h2 {
        margin: 0 0 18px;
        font-size: 18px;
      }
      .modal .form-actions {
        margin-top: 18px;
      }

      @media (max-width: 640px) {
        .search-bar {
          flex-wrap: wrap;
        }
        .data-table th:nth-child(4),
        .data-table td:nth-child(4) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>优惠券中心</h1>
        <p>支持本地 Node 增删改查，GitHub Pages 仅做静态展示</p>
      </header>

      <nav class="page-nav">
        <a href="./index.html">展示页</a>
        <a href="./guanli.html" class="active">管理页</a>
      </nav>

      <section class="search-bar">
        <input type="text" id="search-input" placeholder="搜索标题 / 优惠码..." />
        <button id="add-btn" class="primary">新增优惠券</button>
      </section>

      <div id="count-bar" class="count-bar">
        <span id="count-text">共 0 条</span>
      </div>

      <section id="table-section" class="table-wrap"></section>

      <!-- 新增/编辑模态框 -->
      <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
          <h2 id="modal-title">新增优惠券</h2>
          <form id="coupon-form">
            <input type="hidden" id="coupon-id" />
            <label>
              标题
              <input type="text" id="title" placeholder="例如：满 100 减 20" required />
            </label>
            <label>
              优惠码
              <input type="text" id="code" placeholder="例如：SAVE20" required />
            </label>
            <label>
              有效期
              <input type="date" id="expireAt" required />
            </label>
            <label>
              链接
              <input type="url" id="link" placeholder="https://" required />
            </label>
            <div class="form-actions">
              <button type="submit" class="primary">保存</button>
              <button type="button" id="cancel-btn" class="secondary">取消</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="./guanli.js"></script>
  </body>
</html>
