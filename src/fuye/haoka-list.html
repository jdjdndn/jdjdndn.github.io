      { title: '中国电信汉绣卡', desc: '39元130G+30G定向+200分钟，仅限湖北四城。', url: '../article/card/hanxiu-card.html', tag: '39元160G', carrier: '电信' },
      { title: '中国电信敬亭卡', desc: '39元150G+100分钟，48个月优惠期。', url: '../article/card/jingting-card.html', tag: '39元150G', carrier: '电信' },
      { title: '中国电信云朵卡', desc: '39元180G+200分钟，无合约期。', url: '../article/card/yunduo-card.html', tag: '39元180G', carrier: '电信' },
      { title: '中国电信泰山卡', desc: '38元190G+300分钟，无合约期。', url: '../article/card/taishan-card.html', tag: '38元190G', carrier: '电信' },

      { title: '中国广电骏马卡', desc: '29元192G通用，首月免月租。', url: '../article/card/junma-card.html', tag: '29元192G', carrier: '广电' },
      { title: '中国广电天马卡', desc: '29元192G通用，可发全国。', url: '../article/card/tianma-card.html', tag: '29元192G', carrier: '广电' },
      { title: '中国广电奔马卡', desc: '39元60G通用，可办副卡。', url: '../article/card/benma-card.html', tag: '39元60G', carrier: '广电' },
      { title: '中国广电长安卡', desc: '29元100G+100分钟，仅限陕西。', url: '../article/card/changan-card.html', tag: '29元100G', carrier: '广电' },
      { title: '中国广电秦风卡', desc: '38元190G+300分钟，只发陕西四城。', url: '../article/card/qinfeng-card.html', tag: '38元190G', carrier: '广电' },
      { title: '中国广电闽南卡', desc: '39元180G+150分钟，仅发福建。', url: '../article/card/minnan-card.html', tag: '39元180G', carrier: '广电' },
    ];

    var pageSize = 9;
    var currentPage = 1;
    var currentTab = 'all';
    var searchKeyword = '';
    var filteredArticles = articles;

    // 筛选文章
    function filterArticles() {
      filteredArticles = articles.filter(function(item) {
        var matchTab = currentTab === 'all' || item.carrier === currentTab;
        var matchSearch = !searchKeyword ||
          item.title.toLowerCase().indexOf(searchKeyword.toLowerCase()) !== -1 ||
          item.desc.toLowerCase().indexOf(searchKeyword.toLowerCase()) !== -1;
        return matchTab && matchSearch;
      });
      currentPage = 1;
    }

    // 渲染文章
    function renderArticles() {
      var grid = document.getElementById('articleGrid');
      var emptyState = document.getElementById('emptyState');
      var start = (currentPage - 1) * pageSize;
      var end = start + pageSize;
      var pageArticles = filteredArticles.slice(start, end);

      if (filteredArticles.length === 0) {
        grid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      grid.style.display = '';
      emptyState.style.display = 'none';

      var html = '';
      pageArticles.forEach(function(item) {
        html += '<a href="' + item.url + '" class="article-card">';
        html += '<h3>' + item.title + '</h3>';
        html += '<p>' + item.desc + '</p>';
        html += '<span class="tag">' + item.tag + '</span>';
        html += '</a>';
      });
      grid.innerHTML = html;
    }

    // 渲染分页
    function renderPagination() {
      var pagination = document.getElementById('pagination');
      var totalPages = Math.ceil(filteredArticles.length / pageSize);

      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      var html = '';
      html += '<button onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>';

      for (var i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += '<span class="page-info">...</span>';
        }
      }

      html += '<button onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
      html += '<span class="page-info">共 ' + filteredArticles.length + ' 篇</span>';

      pagination.innerHTML = html;
    }

    // 跳转页面
    function goToPage(page) {
      var totalPages = Math.ceil(filteredArticles.length / pageSize);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderArticles();
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Tab 切换
    var tabNav = document.getElementById('tabNav');
    tabNav.addEventListener('click', function(e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;

      // 更新 active 状态
      tabNav.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');

      currentTab = btn.dataset.carrier;
      filterArticles();
      renderArticles();
      renderPagination();
    });

    // 搜索功能
    var searchInput = document.getElementById('searchInput');
    var searchTimer = null;
    searchInput.addEventListener('input', function() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function() {
        searchKeyword = searchInput.value.trim();
        filterArticles();
        renderArticles();
        renderPagination();
      }, 300);
    });

    // 返回顶部按钮
    var backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', function() {
      if (window.scrollY > 300) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });
    backToTop.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 初始化
    filterArticles();
    renderArticles();
    renderPagination();
    </script>
  </body>
</html>
