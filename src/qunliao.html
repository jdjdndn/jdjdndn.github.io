    <script>
      // ===== 群聊搜索（过滤卡片） =====
      (function () {
        var input = document.getElementById('q-search');
        var clear = document.getElementById('q-clear');
        var count = document.getElementById('q-count');
        var cards = document.querySelectorAll('.q-card');
        if (!input) return;
        input.addEventListener('input', function () {
          var q = this.value.trim().toLowerCase();
          var bar = this.closest('.q-search-bar');
          if (bar) bar.classList.toggle('has-text', !!this.value);
          var n = 0;
          cards.forEach(function (card) {
            var show = !q || card.textContent.toLowerCase().indexOf(q) !== -1;
            card.style.display = show ? '' : 'none';
            if (show) n++;
          });
          if (count) {
            count.textContent = q ? (n ? '找到 ' + n + ' 个群聊' : '未找到相关群聊') : '';
            count.style.display = q ? 'block' : 'none';
          }
        });
        if (clear) {
          clear.addEventListener('click', function () {
            input.value = '';
            input.dispatchEvent(new Event('input'));
            input.focus();
          });
        }
      })();
    </script>
