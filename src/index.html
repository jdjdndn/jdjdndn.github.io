<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>优惠活动聚合</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -4px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          优惠活动聚合
        </h1>
        <p>外卖 · 出行 · 购物 · 酒旅 · 电影票 · 快递 — 一站全聚合</p>
        <div class="header-stats" id="header-stats"></div>
      </header>

      <!-- 搜索栏 -->
      <div class="search-bar" role="search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="search-input" placeholder="搜索优惠名称、口令码..." aria-label="搜索优惠" />
        <button class="search-clear" id="search-clear" aria-label="清除搜索">✕</button>
      </div>
      <div class="search-count" id="search-count" aria-live="polite"></div>

      <!-- Tab 导航 -->
      <nav id="tab-nav" class="tab-nav" role="tablist" aria-label="优惠分类"></nav>

      <!-- Tab 内容 -->
      <main id="tab-content" class="tab-content" role="tabpanel"></main>
    </div>

    <!-- 友情链接（fixed 吸底，可收起） -->
    <footer class="footer" id="footer">
      <div class="footer-inner">
        <button class="footer-toggle" id="footer-toggle" aria-expanded="true" aria-controls="footer-body">
          <span>🔗 友情链接</span>
          <span class="footer-arrow" id="footer-arrow">▲</span>
        </button>
        <div class="footer-body" id="footer-body">
          <div id="friend-links" class="friend-links"></div>
          <p class="footer-note">省钱大作战，我们一起冲！</p>
        </div>
      </div>
    </footer>

    <!-- 二维码弹窗 -->
    <div id="qr-overlay" class="qr-overlay hidden" role="dialog" aria-modal="true" aria-label="手机扫码访问">
      <div class="qr-modal">
        <div class="qr-header">
          <span class="qr-title">手机扫码访问</span>
          <button id="qr-close" class="qr-close" aria-label="关闭弹窗">✕</button>
        </div>
        <div class="qr-body">
          <img id="qr-img" class="qr-img" alt="QR Code" />
          <p id="qr-name" class="qr-name"></p>
          <p class="qr-hint">打开手机相机或微信扫一扫</p>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" aria-live="polite" role="status">已复制</div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
