  <body>
    <!-- 页面加载进度条 -->
    <div class="progress-bar" id="progress-bar"></div>

    <div class="app-wrapper"><nav class="side-nav" id="side-nav"></nav><div id="app">
      <!-- SEO: 视觉隐藏的 h1（页面以 iframe 为主，h1 供搜索引擎识别） -->
      <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">券宝 — 优惠券聚合平台</h1>

      <!-- iframe 内容区 -->
      <div class="iframe-container">
        <div class="iframe-loading" id="iframe-loading">
          <div class="iframe-loading-spinner"></div>
          <span>加载中...</span>
        </div>
        <iframe
          src="https://kzurl18.cn/tHj1ww"
          class="index-iframe"
          id="index-iframe"
          title="优惠券平台"
          allowfullscreen
          loading="lazy"
        ></iframe>
        <div class="iframe-error hidden" id="iframe-error">
          <p>页面加载失败，请检查网络后刷新</p>
          <button onclick="location.reload()" class="btn-retry">刷新重试</button>
        </div>
      </div>

    </div></div>

    <!-- <div id="toast" class="toast hidden" aria-live="polite" role="status">已复制</div> -->

    <script>
      // 进度条自动隐藏
      (function() {
        var p = document.getElementById('progress-bar');
        if (!p) return;
        p.style.width = '90%';
        setTimeout(function() { p.style.width = '100%'; p.style.opacity = '0'; }, 300);
        setTimeout(function() { p.style.display = 'none'; }, 600);
      })();

      // iframe 加载状态
      (function() {
        var iframe = document.getElementById('index-iframe');
        var loading = document.getElementById('iframe-loading');
        var error = document.getElementById('iframe-error');
        if (!iframe || !loading) return;

        var failTimer = setTimeout(function() {
          // 15秒超时未加载则显示错误
          if (!iframe._loaded) {
            loading.classList.add('fade-out');
            error.classList.remove('hidden');
          }
        }, 15000);

        iframe.addEventListener('load', function() {
          iframe._loaded = true;
          clearTimeout(failTimer);
          loading.classList.add('fade-out');
          setTimeout(function() { loading.style.display = 'none'; }, 300);
        });

        iframe.addEventListener('error', function() {
          clearTimeout(failTimer);
          loading.classList.add('fade-out');
          error.classList.remove('hidden');
        });
      })();
    </script>
