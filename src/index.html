<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>优惠活动聚合</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>🎉 优惠活动聚合</h1>
        <p>外卖 · 出行 · 购物 · 酒旅 · 电影票 · 快递 — 一站全聚合</p>
      </header>

      <!-- Tab 导航 -->
      <nav id="tab-nav" class="tab-nav"></nav>

      <!-- Tab 内容 -->
      <main id="tab-content" class="tab-content"></main>
    </div>

    <!-- 友情链接（fixed 吸底，放在 #app 外以便全宽居中） -->
    <footer class="footer">
      <div class="footer-inner">
        <h2>🔗 友情链接</h2>
        <div id="friend-links" class="friend-links"></div>
        <p class="footer-note">省钱大作战，我们一起冲！🚀</p>
      </div>
    </footer>

    <!-- 二维码弹窗 -->
    <div id="qr-overlay" class="qr-overlay hidden">
      <div class="qr-modal">
        <div class="qr-header">
          <span class="qr-title">手机扫码访问</span>
          <button id="qr-close" class="qr-close">✕</button>
        </div>
        <div class="qr-body">
          <img id="qr-img" class="qr-img" alt="QR Code" />
          <p id="qr-name" class="qr-name"></p>
          <p class="qr-hint">打开手机相机或微信扫一扫</p>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden">已复制</div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
